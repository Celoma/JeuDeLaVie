<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jeu de la vie</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <canvas id="board" aria-label="Grille du jeu de la vie"></canvas>
  <div class="actions">
    <button id="start" type="button">Commencer</button>
    <button id="pause" type="button">Pause</button>
    <button id="reset" type="button">Réinitialiser</button>
    <output id="generation" aria-label="Génération">Génération : 0</output>
  </div>
  <script src="/app.js"></script>
</body>
</html>
